# Render Blueprint for the recommender API (Backend/app.py).
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: crib-crew-recommender-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd Backend && gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
