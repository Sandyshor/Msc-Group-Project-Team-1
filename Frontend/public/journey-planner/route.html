<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#153b35" />
  <title>Crib Crew — Journey planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="route.css?v=12" />
</head>
<body>
  <div class="app-shell route-shell">
    <main class="main-panel">
      <section class="route-layout">
        <div class="route-map-wrap">
          <div id="routeMap" class="route-map" aria-label="Map: click to set start and end points"></div>
          <div class="map-vignette" aria-hidden="true"></div>
          <div id="mapHint" class="map-hint" aria-live="polite">Click the map to set your <strong>start</strong> point</div>
          <div id="amenityStatus" class="amenity-status" role="status" aria-live="polite" hidden></div>
          <div id="mapLegend" class="map-legend" hidden>
            <span><i class="legend-walk"></i>Walk</span>
            <span><i style="--c:#1d63a8"></i>Bus</span>
            <span><i style="--c:#2f8f46"></i>Luas</span>
            <span><i style="--c:#7a3e9d"></i>Train</span>
            <span><i style="--c:#e08a12"></i>Bike</span>
            <span><i class="legend-alt"></i>Other options</span>
          </div>
        </div>

        <aside class="route-panel" aria-label="Journey details">
          <div class="route-controls">
            <a class="reset-button route-home" href="/" title="Back to Find Your Dublin">← <span>Find Your Dublin</span></a>
            <div class="segmented" role="radiogroup" aria-label="Travel mode">
              <label><input type="radio" name="mode" value="transit" checked><span>Public transport</span></label>
              <label><input type="radio" name="mode" value="walk"><span>Walk</span></label>
              <label><input type="radio" name="mode" value="bike"><span>Bike</span></label>
            </div>
            <div class="time-row">
              <select id="timeType" aria-label="Departure or arrival">
                <option value="now">Leave now</option>
                <option value="depart">Leave at</option>
                <option value="arrive">Arrive by</option>
              </select>
              <input id="timeInput" type="datetime-local" aria-label="Time (Dublin)" hidden>
              <button id="routeResetBtn" class="reset-button route-reset" type="button" title="Clear start and end points">↻ <span>Reset</span></button>
            </div>
          </div>

          <div id="routeStatus" class="route-status" role="status" hidden></div>
          <div id="routeError" class="error-box" role="alert" hidden></div>

          <div id="routeResult" hidden>
            <div id="routeTabs" class="route-tabs" role="tablist" aria-label="Route options"></div>
            <dl id="routeSummary" class="route-summary"></dl>
            <ol id="routeSteps" class="route-steps"></ol>
          </div>

          <div id="routeEmpty" class="route-empty">
            <svg class="empty-art" viewBox="0 0 240 110" aria-hidden="true">
              <path class="empty-road" d="M30 82 C 70 82, 70 30, 120 34 S 170 86, 210 30"/>
              <path class="empty-route" pathLength="1" d="M30 82 C 70 82, 70 30, 120 34 S 170 86, 210 30"/>
              <circle class="empty-stop" cx="120" cy="34" r="5"/>
              <g class="empty-pin empty-pin-a" transform="translate(30 82)"><path d="M0 0 C -9 -12 -11 -16 -11 -21 a11 11 0 0 1 22 0 c0 5 -2 9 -11 21z"/><text y="-17">A</text></g>
              <g class="empty-pin empty-pin-b" transform="translate(210 30)"><path d="M0 0 C -9 -12 -11 -16 -11 -21 a11 11 0 0 1 22 0 c0 5 -2 9 -11 21z"/><text y="-17">B</text></g>
            </svg>
            <strong>Where are you going?</strong>
            <p>Click the map to set your start and destination, or choose a university, famous place or amenity from the map layers. Drag either pin to adjust the route.</p>
          </div>
        </aside>
      </section>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="route.js?v=12"></script>
</body>
</html>
